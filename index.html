<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 번호 — 로또 추천</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B1220;
    --bg-soft: #10192E;
    --panel: #131E36;
    --line: rgba(240,244,255,0.09);
    --ink: #EDEFF7;
    --ink-dim: #8B94AE;

    --ball-1: #FBC400; /* 1-10 노랑 */
    --ball-2: #69C8F2; /* 11-20 파랑 */
    --ball-3: #FF7272; /* 21-30 빨강 */
    --ball-4: #AAAAAA; /* 31-40 회색 */
    --ball-5: #B0D840; /* 41-45 초록 */
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(105,200,242,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(251,196,0,0.07), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px 100px;
  }

  header{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 48px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    letter-spacing: 0.02em;
    font-size: 15px;
    color: var(--ink-dim);
  }
  .brand-dot{
    width:8px;height:8px;border-radius:50%;
    background: var(--ball-2);
    box-shadow: 0 0 12px var(--ball-2);
  }
  .date-tag{
    font-family:'Space Grotesk', sans-serif;
    font-size:13px;
    color: var(--ink-dim);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 100px;
  }

  .hero{
    margin-bottom: 40px;
  }
  .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ball-1);
    margin: 0 0 14px;
    font-weight: 600;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size: clamp(32px, 6vw, 48px);
    line-height: 1.15;
    font-weight: 700;
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }
  h1 span{
    background: linear-gradient(92deg, var(--ball-1), var(--ball-2) 55%, var(--ball-5));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub{
    color: var(--ink-dim);
    font-size: 15.5px;
    line-height: 1.7;
    max-width: 480px;
    margin: 0;
  }

  /* 번호 표시판 */
  .stage{
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 40px 28px 32px;
    margin: 36px 0 20px;
    overflow: hidden;
  }
  .stage::before{
    content:'';
    position:absolute; inset:0;
    background: radial-gradient(500px 200px at 50% -20%, rgba(255,255,255,0.05), transparent 70%);
    pointer-events:none;
  }

  .balls{
    display:flex;
    flex-direction: column;
    gap: 14px;
    min-height: 92px;
  }

  .ball-set-row{
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .set-label{
    width: 44px;
    flex-shrink: 0;
    font-family:'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-dim);
  }
  .set-balls{
    display:flex;
    gap: 9px;
    flex-wrap: wrap;
  }

  .ball{
    --c: var(--ball-1);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: #10192E;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,0.85), rgba(255,255,255,0) 42%),
      var(--c);
    box-shadow:
      0 4px 10px rgba(0,0,0,0.35),
      inset 0 -4px 7px rgba(0,0,0,0.18);
    opacity: 0;
    transform: translateY(14px) scale(0.6);
    transition: opacity 0.35s ease, transform 0.45s cubic-bezier(.34,1.56,.64,1);
    flex-shrink: 0;
  }
  .ball.show{
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .ball.rolling{
    animation: roll 0.55s ease-in-out infinite;
  }
  @keyframes roll{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-6px) rotate(8deg); }
  }

  .placeholder-row{
    display:flex;
    gap:12px;
    justify-content:center;
    color: var(--ink-dim);
    font-family:'Space Grotesk', sans-serif;
    font-size: 13px;
  }

  .legend{
    display:flex;
    justify-content:center;
    gap: 16px;
    margin-top: 24px;
    flex-wrap: wrap;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size: 12px;
    color: var(--ink-dim);
    font-family:'Space Grotesk', sans-serif;
  }
  .legend-dot{
    width:9px;height:9px;border-radius:50%;
  }

  .controls{
    display:flex;
    gap:12px;
    margin-top: 8px;
    align-items:center;
  }
  button{
    font-family:'Noto Sans KR', sans-serif;
    cursor:pointer;
    border:none;
    outline: none;
  }
  .btn-primary{
    flex:1;
    background: linear-gradient(92deg, var(--ball-1), #f2a900);
    color: #16110a;
    font-weight: 700;
    font-size: 16px;
    padding: 17px 20px;
    border-radius: 14px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 20px rgba(251,196,0,0.18);
  }
  .btn-primary:hover{ transform: translateY(-1px); box-shadow: 0 10px 26px rgba(251,196,0,0.26); }
  .btn-primary:active{ transform: translateY(0px) scale(0.99); }
  .btn-primary:disabled{ opacity:0.6; cursor:default; transform:none; }

  .btn-ghost{
    background: transparent;
    border: 1px solid var(--line) !important;
    color: var(--ink-dim);
    font-size: 14px;
    padding: 17px 18px;
    border-radius: 14px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .btn-ghost:hover{ border-color: rgba(240,244,255,0.25) !important; color: var(--ink); }

  /* 옵션 */
  .options{
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .options-title{
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 12px;
    font-family:'Space Grotesk', sans-serif;
  }
  .num-grid{
    display:grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 6px;
  }
  .num-cell{
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    color: var(--ink-dim);
    font-family:'Space Grotesk', sans-serif;
    font-size: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all 0.15s ease;
  }
  .num-cell.excluded{
    background: rgba(255,114,114,0.12);
    border-color: rgba(255,114,114,0.4);
    color: #FF9E9E;
    text-decoration: line-through;
  }
  .hint{
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 10px;
    line-height: 1.6;
  }

  /* 히스토리 */
  .history{
    margin-top: 36px;
  }
  .history-title{
    font-family:'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-dim);
    margin-bottom: 14px;
    display:flex;
    justify-content: space-between;
    align-items:center;
  }
  .history-clear{
    font-family:'Noto Sans KR', sans-serif;
    background:none;
    border:none;
    color: var(--ink-dim);
    font-size: 12px;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .history-clear:hover{ color: var(--ink); }
  .history-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .history-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
  }
  .history-nums{
    display:flex;
    gap:8px;
  }
  .mini-ball{
    width:30px; height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Grotesk', sans-serif;
    font-size: 12px;
    font-weight:700;
    color:#10192E;
  }
  .history-time{
    font-family:'Space Grotesk', sans-serif;
    font-size: 11px;
    color: var(--ink-dim);
  }
  .empty-history{
    color: var(--ink-dim);
    font-size: 13px;
    padding: 18px 4px;
    text-align:center;
    border: 1px dashed var(--line);
    border-radius: 12px;
  }

  footer{
    margin-top: 56px;
    text-align:center;
    color: var(--ink-dim);
    font-size: 12px;
    line-height:1.7;
  }

  @media (prefers-reduced-motion: reduce){
    .ball, .ball.rolling{ animation: none !important; transition: none !important; }
  }

  @media (max-width: 480px){
    .ball{ width: 36px; height:36px; font-size:13px; }
    .set-label{ width: 36px; font-size: 11px; }
    .set-balls{ gap: 6px; }
    .num-grid{ grid-template-columns: repeat(7, 1fr); }
    .wrap{ padding: 44px 16px 80px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand"><span class="brand-dot"></span>오늘의 번호</div>
    <div class="date-tag" id="dateTag"></div>
  </header>

  <div class="hero">
    <p class="eyebrow">1 ~ 45 · 6개 번호</p>
    <h1>오늘은 어떤 <span>번호</span>가<br>당신을 기다릴까요</h1>
    <p class="sub">공을 굴려 무작위로 6개 번호를 뽑아드려요. 제외하고 싶은 번호가 있다면 아래에서 미리 골라두세요.</p>
  </div>

  <div class="stage">
    <div class="balls" id="ballsRow">
      <div class="placeholder-row">번호를 생성해보세요</div>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:var(--ball-1)"></span>1–10</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--ball-2)"></span>11–20</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--ball-3)"></span>21–30</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--ball-4)"></span>31–40</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--ball-5)"></span>41–45</div>
    </div>

    <div class="controls" style="margin-top:24px;">
      <button class="btn-primary" id="drawBtn">번호 뽑기</button>
      <button class="btn-ghost" id="optionsBtn">제외 번호</button>
    </div>

    <div class="options" id="optionsPanel" style="display:none;">
      <div class="options-title">클릭해서 이번 추첨에서 제외할 번호를 선택하세요</div>
      <div class="num-grid" id="numGrid"></div>
      <div class="hint">제외한 번호가 너무 많으면(40개 이상) 자동으로 초기화돼요.</div>
    </div>
  </div>

  <div class="history">
    <div class="history-title">
      <span>이전 기록</span>
      <button class="history-clear" id="clearHistory">기록 지우기</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty-history">아직 뽑은 번호가 없어요</div>
    </div>
  </div>

  <footer>
    무작위로 생성된 번호이며 당첨을 보장하지 않습니다.<br>
    재미로 즐겨주세요 🍀
  </footer>

</div>

<script>
  const ballColor = (n) => {
    if(n <= 10) return 'var(--ball-1)';
    if(n <= 20) return 'var(--ball-2)';
    if(n <= 30) return 'var(--ball-3)';
    if(n <= 40) return 'var(--ball-4)';
    return 'var(--ball-5)';
  };

  const dateTag = document.getElementById('dateTag');
  const today = new Date();
  dateTag.textContent = today.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'short' });

  const excluded = new Set();
  const numGrid = document.getElementById('numGrid');
  for(let i=1;i<=45;i++){
    const cell = document.createElement('div');
    cell.className = 'num-cell';
    cell.textContent = i;
    cell.addEventListener('click', () => {
      if(excluded.has(i)){ excluded.delete(i); cell.classList.remove('excluded'); }
      else {
        if(excluded.size >= 39){ excluded.clear(); document.querySelectorAll('.num-cell').forEach(c=>c.classList.remove('excluded')); return; }
        excluded.add(i); cell.classList.add('excluded');
      }
    });
    numGrid.appendChild(cell);
  }

  document.getElementById('optionsBtn').addEventListener('click', () => {
    const panel = document.getElementById('optionsPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  });

  function pickNumbers(){
    const pool = [];
    for(let i=1;i<=45;i++){ if(!excluded.has(i)) pool.push(i); }
    const picked = [];
    while(picked.length < 6 && pool.length > 0){
      const idx = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(idx,1)[0]);
    }
    return picked.sort((a,b)=>a-b);
  }

  const ballsRow = document.getElementById('ballsRow');
  const drawBtn = document.getElementById('drawBtn');
  const historyList = document.getElementById('historyList');
  let history = [];

  function makeMiniBall(n){
    const b = document.createElement('div');
    b.className = 'mini-ball';
    b.style.background = `radial-gradient(circle at 32% 28%, rgba(255,255,255,0.7), rgba(255,255,255,0) 42%), ${ballColor(n)}`;
    b.textContent = n;
    return b;
  }

  function renderHistory(){
    if(history.length === 0){
      historyList.innerHTML = '<div class="empty-history">아직 뽑은 번호가 없어요</div>';
      return;
    }
    historyList.innerHTML = '';
    history.slice(0,6).forEach(entry => {
      const row = document.createElement('div');
      row.className = 'history-row';

      const nums = document.createElement('div');
      nums.className = 'history-nums';
      entry.set.forEach(n => nums.appendChild(makeMiniBall(n)));

      const time = document.createElement('div');
      time.className = 'history-time';
      time.textContent = entry.time;

      row.appendChild(nums);
      row.appendChild(time);
      historyList.appendChild(row);
    });
  }

  document.getElementById('clearHistory').addEventListener('click', () => {
    history = [];
    renderHistory();
  });

  function draw(){
    drawBtn.disabled = true;
    drawBtn.textContent = '뽑는 중…';

    const finalSet = pickNumbers();

    ballsRow.innerHTML = '';
    const setBalls = document.createElement('div');
    setBalls.className = 'set-balls';
    setBalls.style.justifyContent = 'center';
    ballsRow.appendChild(setBalls);

    const allTempBalls = []; // [{ballEl, num}]
    finalSet.forEach(n => {
      const b = document.createElement('div');
      b.className = 'ball rolling';
      b.style.setProperty('--c', 'var(--ball-4)');
      b.textContent = '?';
      setBalls.appendChild(b);
      requestAnimationFrame(() => b.classList.add('show'));
      allTempBalls.push({ el: b, num: n });
    });

    let revealed = 0;
    const total = allTempBalls.length;
    const revealNext = () => {
      if(revealed >= total){
        drawBtn.disabled = false;
        drawBtn.textContent = '다시 뽑기';
        history.unshift({
          set: finalSet,
          time: new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' })
        });
        renderHistory();
        return;
      }
      const { el, num } = allTempBalls[revealed];
      el.classList.remove('rolling');
      el.style.setProperty('--c', ballColor(num));
      el.textContent = num;
      revealed++;
      setTimeout(revealNext, 90);
    };
    setTimeout(revealNext, 450);
  }

  drawBtn.addEventListener('click', draw);
</script>
</body>
</html>
